<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>開発メニュー | 親子で自転車ルールクイズ</title>
  <style>
    :root { color-scheme: dark; --ink: #f8fafc; --muted: #a7b0c2; --accent: #5eead4; --warm: #fbbf24; --line: rgba(148, 163, 184, .25); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100svh; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background: radial-gradient(ellipse at 90% 0%, rgba(20,184,166,.18), transparent 32%), #111827; }
    main { width: min(100%, 920px); min-height: 100svh; margin: auto; padding: max(22px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom)); }
    header { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 10px; font-weight: 900; letter-spacing: .12em; }
    h1 { margin: 0; font-size: 24px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 12px; }
    .stage { padding: 13px 0 12px; border-bottom: 1px solid var(--line); }
    .stage-heading { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; }
    .stage-heading h2 { margin: 0; font-size: 16px; }
    .stage-heading span { color: var(--muted); font-size: 11px; }
    .question-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    a { display: flex; align-items: center; gap: 7px; min-width: 0; min-height: 38px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: rgba(30, 41, 59, .74); text-decoration: none; }
    a:hover, a:focus-visible { border-color: var(--accent); background: rgba(13, 148, 136, .22); outline: none; }
    .number { flex: 0 0 auto; color: var(--warm); font-size: 11px; font-weight: 900; }
    .question { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    rt { font-size: .5em; }
    .stage-final { border-bottom: 0; }
    @media (orientation: landscape) and (max-height: 500px) {
      main { padding: 8px max(18px, env(safe-area-inset-left)) 6px; }
      header { align-items: center; padding-bottom: 7px; }
      .eyebrow { margin-bottom: 2px; font-size: 8px; }
      h1 { font-size: 19px; }
      .subtitle { font-size: 10px; }
      .stage { padding: 6px 0; }
      .stage-heading { margin-bottom: 5px; }
      .stage-heading h2 { font-size: 13px; }
      .stage-heading span { font-size: 9px; }
      .question-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
      a { min-height: 32px; padding: 4px 6px; gap: 5px; }
      .question { font-size: 9px; }
      .number { font-size: 9px; }
    }
    @media (max-width: 560px) and (orientation: portrait) {
      .question-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header { align-items: start; flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">DEVELOPMENT ONLY</p><h1>クイズ<ruby>開発<rt>かいはつ</rt></ruby>メニュー</h1></div>
      <p class="subtitle"><ruby>確認<rt>かくにん</rt></ruby>したい<ruby>問題<rt>もんだい</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぶと、その<ruby>画面<rt>がめん</rt></ruby>から<ruby>開始<rt>かいし</rt></ruby>します。</p>
    </header>

    <section class="stage" aria-labelledby="quiz-title">
      <div class="stage-heading"><h2 id="quiz-title">クイズ（<ruby>時間制限<rt>じかんせいげん</rt></ruby>なし）</h2><span>10<ruby>問<rt>もん</rt></ruby></span></div>
      <nav id="quiz-questions" class="question-grid" aria-label="クイズの問題"></nav>
    </section>

    <section class="stage stage-final" aria-labelledby="stage-final-title">
      <div class="stage-heading"><h2 id="stage-final-title"><ruby>最終<rt>さいしゅう</rt></ruby>ステージ</h2><span><ruby>危険<rt>きけん</rt></ruby>な<ruby>場所<rt>ばしょ</rt></ruby><ruby>探<rt>さが</rt></ruby>し（3<ruby>問<rt>もん</rt></ruby>）</span></div>
      <nav class="question-grid" aria-label="最終ステージの問題">
        <a href="index.html?dev=1&amp;stage=spot&amp;q=1"><span class="number">01</span><span class="question"><ruby>第<rt>だい</rt></ruby>1<ruby>問<rt>もん</rt></ruby></span></a>
        <a href="index.html?dev=1&amp;stage=spot&amp;q=2"><span class="number">02</span><span class="question"><ruby>第<rt>だい</rt></ruby>2<ruby>問<rt>もん</rt></ruby></span></a>
        <a href="index.html?dev=1&amp;stage=spot&amp;q=3"><span class="number">03</span><span class="question"><ruby>第<rt>だい</rt></ruby>3<ruby>問<rt>もん</rt></ruby></span></a>
      </nav>
    </section>
  </main>
  <script>
    const labels = [
      '<ruby>車道通行<rt>しゃどうつうこう</rt></ruby>の<ruby>年齢<rt>ねんれい</rt></ruby>', '<ruby>青切符<rt>あおきっぷ</rt></ruby>の<ruby>対象年齢<rt>たいしょうねんれい</rt></ruby>', '<ruby>車道<rt>しゃどう</rt></ruby>の<ruby>左側<rt>ひだりがわ</rt></ruby>', '<ruby>止<rt>と</rt></ruby>まれの<ruby>標識<rt>ひょうしき</rt></ruby>', '<ruby>横断歩道<rt>おうだんほどう</rt></ruby>の<ruby>歩行者<rt>ほこうしゃ</rt></ruby>',
      '<ruby>友達<rt>ともだち</rt></ruby>との<ruby>並進<rt>へいしん</rt></ruby>', 'ハンドルの<ruby>荷物<rt>にもつ</rt></ruby>', 'ブレーキの<ruby>安全点検<rt>あんぜんてんけん</rt></ruby>', '<ruby>歩道<rt>ほどう</rt></ruby>を<ruby>通<rt>とお</rt></ruby>れる<ruby>条件<rt>じょうけん</rt></ruby>', '<ruby>歩道<rt>ほどう</rt></ruby>の<ruby>通行位置<rt>つうこういち</rt></ruby>'
    ];

    function addQuestionLinks(containerId, labels) {
      const container = document.querySelector(`#${containerId}`);
      labels.forEach((label, index) => {
        const link = document.createElement('a');
        link.href = `index.html?dev=1&q=${index + 1}`;
        link.innerHTML = `<span class="number">${String(index + 1).padStart(2, '0')}</span><span class="question"></span>`;
        link.querySelector('.question').innerHTML = label;
        const plainLabel = link.querySelector('.question').cloneNode(true);
        plainLabel.querySelectorAll('rt').forEach((reading) => reading.remove());
        link.setAttribute('aria-label', `${index + 1}問目: ${plainLabel.textContent}へ移動`);
        container.append(link);
      });
    }

    addQuestionLinks('quiz-questions', labels);
  </script>
</body>
</html>
